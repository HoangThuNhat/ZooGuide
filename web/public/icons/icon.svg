<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded squircle background for standard icon -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Brand Map Pin & Audio Waves (ZooGuide Official Brand Shape) -->
  <g transform="translate(256, 240) scale(14)" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -11 A 8 8 0 0 0 -8 -3 C -8 1.5 -5 4.5 -1.5 8.2 L 0 10 L 1.5 8.2 C 5 4.5 8 1.5 8 -3 A 8 8 0 0 0 0 -11 Z" fill="rgba(255,255,255,0.12)"/>
    <circle cx="0" cy="-3" r="2.8" fill="#FFFFFF"/>
  </g>
  
  <!-- Sound / Tour wave arcs -->
  <g stroke="#FDE047" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.95">
    <path d="M 120 180 A 170 170 0 0 1 120 100" />
    <path d="M 392 180 A 170 170 0 0 0 392 100" />
  </g>
  
  <!-- Subtle leaf motif representing Zoo / Nature -->
  <path d="M 256 428 C 240 405 242 385 256 370 C 270 385 272 405 256 428 Z" fill="#86EFAC"/>
</svg>