name: ZooGuide CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      deploy_demo:
        description: "Deploy Demo to Windows Self-hosted Runner (when triggered on feature branch)"
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # JOB 1: BACKEND CI (.NET 8 Restore, Build & Automated Unit/Integration Tests)
  # ============================================================================
  backend-ci:
    name: Backend (.NET 8 Build & Test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Backend & Test dependencies
        run: dotnet restore tests/IntegrationTests/ZooGuide.IntegrationTests.csproj

      - name: Build Backend API & Test Suite (Release)
        run: dotnet build tests/IntegrationTests/ZooGuide.IntegrationTests.csproj --configuration Release --no-restore

      - name: Run Unit & Integration Tests
        env:
          SUPABASE_CONNECTION_STRING: ${{ secrets.SUPABASE_CONNECTION_STRING }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: dotnet test tests/IntegrationTests/ZooGuide.IntegrationTests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload Backend Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: "**/TestResults/*.trx"
          retention-days: 7

  # ============================================================================
  # JOB 2: FRONTEND CI (Node 20, npm ci, PWA Manifest/SW Check & Vite Build)
  # ============================================================================
  frontend-ci:
    name: Frontend (React 18 + Vite + PWA Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend dependencies
        run: npm ci

      - name: Verify PWA Manifest & Service Worker files
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('public/manifest.webmanifest', 'utf8'));
            if (!manifest.name || !manifest.short_name || manifest.display !== 'standalone') {
              throw new Error('Invalid Web App Manifest configuration');
            }
            if (!fs.existsSync('public/sw.js')) {
              throw new Error('Missing Service Worker file public/sw.js');
            }
            console.log('PWA Manifest & Service Worker verified:', manifest.short_name, manifest.display);
          "

      - name: Build Production Frontend Bundle
        env:
          VITE_API_BASE_URL: /api
        run: npm run build

      - name: Upload Frontend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist
          retention-days: 7

  # ============================================================================
  # JOB 3: DOCKER & COMPOSE VALIDATION (Multi-stage Image Builds & Compose Config)
  # ============================================================================
  docker-ci:
    name: Docker Compose & Image Build Validation
    runs-on: ubuntu-latest
    needs:
      - backend-ci
      - frontend-ci
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose.yml syntax & service graph
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "docker-compose.yml configuration is valid."

      - name: Build Backend Docker Image (zooguide-api)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/API/Dockerfile
          push: false
          tags: zooguide-demo-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image (zooguide-frontend)
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: false
          build-args: |
            VITE_API_BASE_URL=/api
          tags: zooguide-demo-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # JOB 4: CD DEMO - Deploy to Windows Self-Hosted Runner (feature branch only)
  # ============================================================================
  deploy-demo:
    name: Deploy Demo on Windows Self-Hosted Runner (zooguide-demo)
    runs-on: [self-hosted, Windows, X64, zooguide-demo]
    needs:
      - backend-ci
      - frontend-ci
      - docker-ci
    if: >
      github.ref == 'refs/heads/feature' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_demo != false)) &&
      vars.ENABLE_DEMO_DEPLOY != 'false'
    concurrency:
      group: zooguide-demo-deployment
      cancel-in-progress: false
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Prepare & Validate Demo Environment (.env)
        env:
          SECRET_SUPABASE_CONNECTION_STRING: ${{ secrets.SUPABASE_CONNECTION_STRING }}
          SECRET_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
          SECRET_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SECRET_VITE_CARTO_API_KEY: ${{ secrets.VITE_CARTO_API_KEY }}
          VAR_API_PORT: ${{ vars.DEMO_API_PORT }}
          VAR_FRONTEND_PORT: ${{ vars.DEMO_FRONTEND_PORT }}
        run: |
          $ErrorActionPreference = "Stop"
          $workspaceEnv = Join-Path $PWD ".env"

          # 1. Locate existing host .env file without ever overwriting the original file
          $candidateEnvPaths = @()
          if ($env:ZOOGUIDE_DEMO_ENV_FILE) { $candidateEnvPaths += $env:ZOOGUIDE_DEMO_ENV_FILE }
          $candidateEnvPaths += "C:\actions-runner\.env.zooguide-demo"
          $candidateEnvPaths += "C:\Users\admin\Desktop\Study\Công nghệ phần mềm\ZooGuide\.env"

          $sourceEnv = $candidateEnvPaths | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if ($sourceEnv -and ($sourceEnv -ne $workspaceEnv)) {
              Copy-Item -Path $sourceEnv -Destination $workspaceEnv -Force
              Write-Output "Loaded base Demo environment configuration from host file: $sourceEnv"
          } elseif (-not (Test-Path $workspaceEnv)) {
              New-Item -ItemType File -Path $workspaceEnv -Force | Out-Null
              Write-Output "Initialized empty workspace .env file to populate from GitHub Secrets/Variables."
          }

          # 2. Parse key-value pairs safely
          $envMap = @{}
          Get-Content $workspaceEnv | ForEach-Object {
              $line = $_.Trim()
              if ($line -and -not $line.StartsWith("#") -and $line.Contains("=")) {
                  $idx = $line.IndexOf("=")
                  $k = $line.Substring(0, $idx).Trim()
                  $v = $line.Substring($idx + 1).Trim()
                  $envMap[$k] = $v
              }
          }

          # 3. Allow GitHub Secrets / Variables to supply or override values if configured
          if ($env:SECRET_SUPABASE_CONNECTION_STRING) { $envMap["SUPABASE_CONNECTION_STRING"] = $env:SECRET_SUPABASE_CONNECTION_STRING }
          if ($env:SECRET_SUPABASE_URL) { $envMap["SUPABASE_URL"] = $env:SECRET_SUPABASE_URL }
          if ($env:SECRET_SUPABASE_STORAGE_BUCKET) { $envMap["SUPABASE_STORAGE_BUCKET"] = $env:SECRET_SUPABASE_STORAGE_BUCKET }
          if ($env:SECRET_SUPABASE_SERVICE_ROLE_KEY) { $envMap["SUPABASE_SERVICE_ROLE_KEY"] = $env:SECRET_SUPABASE_SERVICE_ROLE_KEY }
          if ($env:SECRET_VITE_CARTO_API_KEY) { $envMap["VITE_CARTO_API_KEY"] = $env:SECRET_VITE_CARTO_API_KEY }
          if ($env:VAR_API_PORT) { $envMap["API_PORT"] = $env:VAR_API_PORT }
          if ($env:VAR_FRONTEND_PORT) { $envMap["FRONTEND_PORT"] = $env:VAR_FRONTEND_PORT }

          # 4. Ensure Demo defaults (Port 3001 avoids Open WebUI on port 3000)
          $envMap["COMPOSE_PROJECT_NAME"] = "zooguide-demo"
          if (-not $envMap["API_PORT"]) { $envMap["API_PORT"] = "8080" }
          if (-not $envMap["FRONTEND_PORT"]) { $envMap["FRONTEND_PORT"] = "3001" }
          if (-not $envMap["VITE_API_BASE_URL"]) { $envMap["VITE_API_BASE_URL"] = "/api" }
          if (-not $envMap["SUPABASE_STORAGE_BUCKET"]) { $envMap["SUPABASE_STORAGE_BUCKET"] = "narration-audio" }

          # 5. Validate required variables without printing secret values
          $requiredKeys = @("SUPABASE_CONNECTION_STRING", "SUPABASE_URL", "SUPABASE_STORAGE_BUCKET", "SUPABASE_SERVICE_ROLE_KEY")
          foreach ($reqKey in $requiredKeys) {
              $val = $envMap[$reqKey]
              if ([string]::IsNullOrWhiteSpace($val) -or $val -match "your_password|your_project_ref|your_username") {
                  throw "Missing or placeholder value for required environment variable: $reqKey. Configure it in host .env or GitHub Actions Secrets."
              }
          }

          # 6. Write workspace .env for docker compose
          $outLines = foreach ($kv in $envMap.GetEnumerator()) { "$($kv.Key)=$($kv.Value)" }
          Set-Content -Path $workspaceEnv -Value $outLines -Encoding UTF8

          Write-Output "Validated Demo configuration keys (secrets redacted):"
          Write-Output "  COMPOSE_PROJECT_NAME=$($envMap['COMPOSE_PROJECT_NAME'])"
          Write-Output "  API_PORT=$($envMap['API_PORT'])"
          Write-Output "  FRONTEND_PORT=$($envMap['FRONTEND_PORT'])"
          Write-Output "  VITE_API_BASE_URL=$($envMap['VITE_API_BASE_URL'])"
          Write-Output "  SUPABASE_URL=$($envMap['SUPABASE_URL'])"
          Write-Output "  SUPABASE_STORAGE_BUCKET=$($envMap['SUPABASE_STORAGE_BUCKET'])"
          Write-Output "  SUPABASE_CONNECTION_STRING=<REDACTED_CONFIGURED>"
          Write-Output "  SUPABASE_SERVICE_ROLE_KEY=<REDACTED_CONFIGURED>"

      - name: Verify Docker Engine & Protect Existing Containers
        run: |
          $ErrorActionPreference = "Stop"
          Write-Output "=== Checking Docker Engine availability ==="
          docker version --format "Client: {{.Client.Version}} | Server: {{.Server.Version}}"

          Write-Output "=== Existing containers before Demo deploy ==="
          docker ps -a --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"

          # Cleanly transition legacy 'zooguide' compose project containers if they are holding Demo ports
          $legacyContainers = docker ps -a --filter "label=com.docker.compose.project=zooguide" --format "{{.Names}}"
          if ($legacyContainers) {
              Write-Output "Transitioning legacy 'zooguide' project containers ($($legacyContainers -join ', ')) to isolated 'zooguide-demo' project (volumes preserved)..."
              docker compose -p zooguide down
          }

      - name: Build & Deploy ZooGuide Demo (docker compose -p zooguide-demo)
        run: |
          $ErrorActionPreference = "Stop"
          docker compose -p zooguide-demo config --quiet
          docker compose -p zooguide-demo up -d --build --remove-orphans
          docker compose -p zooguide-demo ps

      - name: Post-Deploy End-to-End Health & API Verification
        run: |
          $ErrorActionPreference = "Stop"
          $envLines = Get-Content ".env"
          $apiPort = "8080"
          $frontendPort = "3001"
          foreach ($l in $envLines) {
              if ($l -match "^API_PORT=(.+)$") { $apiPort = $Matches[1].Trim() }
              if ($l -match "^FRONTEND_PORT=(.+)$") { $frontendPort = $Matches[1].Trim() }
          }

          Write-Output "Waiting for Backend API (http://localhost:$apiPort/api/health) to report Healthy..."
          $healthy = $false
          $healthData = $null
          for ($i = 1; $i -le 30; $i++) {
              try {
                  $healthData = Invoke-RestMethod -Uri "http://localhost:$apiPort/api/health" -Method Get -TimeoutSec 5
                  if ($healthData.status -eq "Healthy" -and $healthData.databaseConnected -eq $true) {
                      $healthy = $true
                      break
                  }
              } catch {
                  # Wait for container startup
              }
              Start-Sleep -Seconds 3
          }

          if (-not $healthy) {
              Write-Output "=== Backend Container Logs ==="
              docker compose -p zooguide-demo logs api --tail=50
              throw "Backend API did not become healthy within 90 seconds."
          }

          Write-Output "Backend API is Healthy and connected to Supabase PostgreSQL:"
          $healthData | ConvertTo-Json -Depth 4 | Write-Output

          Write-Output "Verifying Frontend Nginx server (http://localhost:$frontendPort/)..."
          $feResp = Invoke-WebRequest -Uri "http://localhost:$frontendPort/" -UseBasicParsing -TimeoutSec 10
          if ($feResp.StatusCode -ne 200) {
              throw "Frontend returned unexpected HTTP status: $($feResp.StatusCode)"
          }
          Write-Output "Frontend HTML loaded (HTTP $($feResp.StatusCode), $($feResp.Content.Length) bytes)."

          Write-Output "Verifying Frontend -> Backend Reverse Proxy & Core APIs via port $frontendPort..."
          $proxyHealth = Invoke-RestMethod -Uri "http://localhost:$frontendPort/api/health" -Method Get -TimeoutSec 10
          $areasResp = Invoke-RestMethod -Uri "http://localhost:$frontendPort/api/areas" -Method Get -TimeoutSec 10
          $animalsResp = Invoke-RestMethod -Uri "http://localhost:$frontendPort/api/animals" -Method Get -TimeoutSec 10
          $poisResp = Invoke-RestMethod -Uri "http://localhost:$frontendPort/api/pois" -Method Get -TimeoutSec 10
          $langsResp = Invoke-RestMethod -Uri "http://localhost:$frontendPort/api/languages" -Method Get -TimeoutSec 10
          $dashResp = Invoke-RestMethod -Uri "http://localhost:$frontendPort/api/dashboard/stats" -Method Get -TimeoutSec 15

          if (-not $proxyHealth.databaseConnected) { throw "Proxy /api/health reported databaseConnected=false" }
          if (-not $dashResp.success) { throw "Dashboard stats endpoint returned success=false" }

          Write-Output "End-to-End Demo Verification PASSED:"
          Write-Output "  - Frontend URL: http://localhost:$frontendPort/"
          Write-Output "  - Admin Dashboard URL: http://localhost:$frontendPort/admin"
          Write-Output "  - Backend Health URL: http://localhost:$apiPort/api/health"
          Write-Output "  - Database Counts: Animals=$($healthData.counts.animals), Areas=$($healthData.counts.areas), POIs=$($poisResp.data.Count), Languages=$($langsResp.data.Count)"

          Write-Output "=== Final Container Status (All Host Containers) ==="
          docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"

  # ============================================================================
  # JOB 5: CONTINUOUS DELIVERY (PRODUCTION) - Strictly main branch only
  # ============================================================================
  deploy-production:
    name: Deploy to Production Server (CD)
    runs-on: ubuntu-latest
    needs:
      - backend-ci
      - frontend-ci
      - docker-ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Deployment Credentials Availability
        id: check_secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_KEY" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice::CD deployment skipped because DEPLOY_SSH_HOST / DEPLOY_SSH_USER / DEPLOY_SSH_KEY secrets are not configured in GitHub Repository Settings."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Execute Remote Docker Compose Deployment via SSH
        if: steps.check_secrets.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_APP_PATH || '/opt/zooguide' }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_PATH && git fetch origin main && git checkout main && git pull origin main && docker compose up -d --build && docker compose ps"
