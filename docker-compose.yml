name: ${COMPOSE_PROJECT_NAME:-zooguide-demo}

services:
  api:
    build:
      context: .
      dockerfile: src/API/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-zooguide-demo}-api:latest
    container_name: ${COMPOSE_PROJECT_NAME:-zooguide-demo}-api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=${SUPABASE_CONNECTION_STRING}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST:-smtp.gmail.com}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT:-587}
      - EMAIL_SMTP_USERNAME=${EMAIL_SMTP_USERNAME:-}
      - EMAIL_SMTP_PASSWORD=${EMAIL_SMTP_PASSWORD:-}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-ZooGuide - Thảo Cầm Viên Sài Gòn}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-}
      - EMAIL_ENABLE_SSL=${EMAIL_ENABLE_SSL:-true}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - zooguide-network

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
        - VITE_CARTO_API_KEY=${VITE_CARTO_API_KEY:-}
    image: ${COMPOSE_PROJECT_NAME:-zooguide-demo}-frontend:latest
    container_name: ${COMPOSE_PROJECT_NAME:-zooguide-demo}-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - zooguide-network

networks:
  zooguide-network:
    driver: bridge
