  <text x="610.0" y="480.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Hiển thị thông báo lỗi: Dữ liệu liên kết</text>
  <text x="610.0" y="492.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">loài, khu vực hoặc chuồng không hợp lệ</text>
  <rect x="460.0" y="520" width="300" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="534.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Sinh mã cá thể (code), INSERT vào bảng</text>
  <text x="610.0" y="546.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">ANIMALS -&gt; Thông báo thêm thành công và</text>
  <text x="610.0" y="558.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">nạp lại danh sách</text>
