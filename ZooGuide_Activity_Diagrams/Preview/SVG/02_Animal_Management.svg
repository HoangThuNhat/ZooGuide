  <text x="40" y="32" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#000000">02. QUẢN LÝ ĐỘNG VẬT (ANIMAL MANAGEMENT)</text>
  <text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333">Quy trình xem danh sách hồ sơ, thêm cá thể, phân bổ chuồng, cập nhật sức khỏe và xóa động vật</text>
