  <rect x="460.0" y="170" width="300" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="184.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Truy vấn JOIN bảng ANIMALS, SPECIES,</text>
  <text x="610.0" y="196.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">ENCLOSURES, AREAS và hiển thị danh sách</text>
  <text x="610.0" y="208.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">hồ sơ cá thể động vật</text>
  <polygon points="220.0,240 300.0,267.5 220.0,295 140.0,267.5" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="220.0" y="261.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#000000" text-anchor="middle">Chọn nghiệp vụ quản</text>
  <text x="220.0" y="272.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#000000" text-anchor="middle">lý?</text>
  <rect x="90.0" y="320" width="260" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="220.0" y="328.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Bấm &#x27;Thêm động vật&#x27; -&gt; Nhập tên cá</text>
  <text x="220.0" y="340.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">thể, giới tính; chọn Loài</text>
  <text x="220.0" y="352.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">(SpeciesId), Phân khu (AreaId),</text>
  <text x="220.0" y="364.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Chuồng (EnclosureId) -&gt; Bấm &#x27;Lưu&#x27;</text>
  <rect x="460.0" y="320" width="300" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="340.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Kiểm tra tính tồn tại của Species, Area,</text>
  <text x="610.0" y="352.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Enclosure trong cơ sở dữ liệu</text>
  <polygon points="610.0,390 700.0,417.5 610.0,445 520.0,417.5" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="417.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#000000" text-anchor="middle">Khóa ngoại hợp lệ?</text>
