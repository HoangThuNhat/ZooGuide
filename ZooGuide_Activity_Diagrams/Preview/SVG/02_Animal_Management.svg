  <text x="220.0" y="624.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Chọn cá thể, chỉnh sửa thông tin</text>
  <text x="220.0" y="636.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">hoặc chọn chuồng nuôi mới -&gt; Bấm</text>
  <text x="220.0" y="648.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">&#x27;Cập nhật&#x27;</text>
  <rect x="460.0" y="610" width="300" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="624.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Xác thực dữ liệu, UPDATE bản ghi ANIMALS</text>
  <text x="610.0" y="636.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">trong Database và hiển thị thông báo cập</text>
  <text x="610.0" y="648.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">nhật thành công</text>
  <rect x="90.0" y="700" width="260" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="220.0" y="708.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Thú y ghi nhận kết quả khám: Tình</text>
  <text x="220.0" y="720.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">trạng sức khỏe, Cân nặng, Thân</text>
  <text x="220.0" y="732.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">nhiệt, Bác sĩ khám -&gt; Bấm &#x27;Lưu hồ</text>
  <text x="220.0" y="744.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">sơ&#x27;</text>
  <rect x="460.0" y="700" width="300" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="714.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Kiểm tra số đo sinh học, UPDATE trường</text>
  <text x="610.0" y="726.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">HealthStatus, LastHealthCheckAt vào bảng</text>
  <text x="610.0" y="738.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">ANIMALS và thông báo thành công</text>
  <rect x="90.0" y="790" width="260" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="220.0" y="810.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Chọn cá thể, bấm &#x27;Xóa&#x27; và xác nhận</text>
  <text x="220.0" y="822.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">trên hộp thoại</text>
  <rect x="460.0" y="790" width="300" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="798.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Kiểm tra ràng buộc lịch sử khám và</text>
  <text x="610.0" y="810.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">thuyết minh -&gt; Xóa hoặc chuyển Status =</text>
  <text x="610.0" y="822.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Inactive trong DB -&gt; Thông báo thành</text>
  <text x="610.0" y="834.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">công</text>
