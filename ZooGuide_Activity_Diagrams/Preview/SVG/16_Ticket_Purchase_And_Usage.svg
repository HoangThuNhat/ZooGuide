  <text x="40" y="32" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#000000">16. MUA VÀ SỬ DỤNG VÉ (TICKET PURCHASE AND USAGE)</text>
  <text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333333">Hành trình tổng thể của khách hàng từ đặt vé, thanh toán, kích hoạt phiên đến trải nghiệm sở thú</text>
