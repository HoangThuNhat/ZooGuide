  <text x="220.0" y="184.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Giai đoạn 1: Khách duyệt các hạng</text>
  <text x="220.0" y="196.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">vé, chọn số lượng, điền thông tin</text>
  <text x="220.0" y="208.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">người mua và gửi yêu cầu đặt vé</text>
  <rect x="460.0" y="170" width="300" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="184.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Tạo đơn hàng TICKET_ORDERS (Pending),</text>
  <text x="610.0" y="196.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">tính tiền, sinh VietQR Napas và đồng hồ</text>
  <text x="610.0" y="208.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">đếm ngược 15 phút</text>
  <rect x="90.0" y="250" width="260" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="220.0" y="264.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Giai đoạn 2: Khách quét VietQR</text>
  <text x="220.0" y="276.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">chuyển khoản (hoặc nhấn nút Giả</text>
  <text x="220.0" y="288.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">lập Sandbox trên màn hình)</text>
  <rect x="460.0" y="250" width="300" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="264.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Xác nhận thanh toán -&gt; Cập nhật đơn hàng</text>
  <text x="610.0" y="276.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Paid -&gt; Tự động phát hành mã vé tham</text>
  <text x="610.0" y="288.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">quan (TKT-xxxx-xxxx) và gửi email</text>
  <rect x="90.0" y="330" width="260" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="220.0" y="338.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Giai đoạn 3: Khách nhận vé điện</text>
  <text x="220.0" y="350.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">tử, bấm &#x27;Kích hoạt phiên ngay&#x27;</text>
  <text x="220.0" y="362.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">(hoặc quét mã QR tại cổng kiểm</text>
  <text x="220.0" y="374.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">soát)</text>
  <rect x="460.0" y="330" width="300" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="344.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Xác thực mã vé hợp lệ và còn hạn -&gt; Khởi</text>
  <text x="610.0" y="356.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">tạo TICKET_SESSION lưu vào Database -&gt;</text>
  <text x="610.0" y="368.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Nâng cấp quyền người dùng</text>
  <rect x="90.0" y="420" width="260" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="220.0" y="422.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Giai đoạn 4: Trở thành &#x27;Validated</text>
  <text x="220.0" y="434.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Visitor&#x27; và trải nghiệm: Nghe</text>
  <text x="220.0" y="446.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">thuyết minh âm thanh 12 ngôn ngữ,</text>
  <text x="220.0" y="458.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Bản đồ dẫn đường Dijkstra và Tra</text>
  <text x="220.0" y="470.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">cứu động vật</text>
  <rect x="90.0" y="510" width="260" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="220.0" y="518.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Giai đoạn 5: Kết thúc chuyến tham</text>
  <text x="220.0" y="530.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">quan (Bấm &#x27;Thoát phiên&#x27; trên thẻ</text>
  <text x="220.0" y="542.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">điện tử hoặc hết thời hạn hiệu lực</text>
  <text x="220.0" y="554.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">của vé)</text>
  <rect x="460.0" y="510" width="300" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="524.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Cập nhật TICKET_SESSIONS sang Status =</text>
  <text x="610.0" y="536.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Revoked/Expired -&gt; Khóa lại các quyền</text>
  <text x="610.0" y="548.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">truy cập nâng cao trên thiết bị</text>
