  <text x="610.0" y="417.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#000000" text-anchor="middle">Dữ liệu hợp lệ?</text>
  <rect x="460.0" y="460" width="300" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="480.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Thông báo lỗi thiếu trường bắt buộc hoặc</text>
  <text x="610.0" y="492.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">trùng tên khoa học</text>
