  <text x="610.0" y="534.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Lưu bản ghi mới vào bảng SPECIES, hiển</text>
  <text x="610.0" y="546.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">thị thông báo thành công và cập nhật</text>
  <text x="610.0" y="558.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">bảng danh sách</text>
  <rect x="90.0" y="610" width="260" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="220.0" y="624.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Chọn loài từ danh sách, bấm &#x27;Chỉnh</text>
  <text x="220.0" y="636.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">sửa&#x27; -&gt; Sửa thông tin -&gt; Bấm &#x27;Lưu</text>
  <text x="220.0" y="648.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">thay đổi&#x27;</text>
  <rect x="460.0" y="610" width="300" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="624.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Kiểm tra ID tồn tại, cập nhật bản ghi</text>
  <text x="610.0" y="636.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">trong bảng SPECIES và thông báo cập nhật</text>
  <text x="610.0" y="648.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">thành công</text>
  <rect x="90.0" y="700" width="260" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="220.0" y="720.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Chọn loài cần xóa, bấm &#x27;Xóa&#x27; và</text>
  <text x="220.0" y="732.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">xác nhận trên hộp thoại</text>
  <rect x="460.0" y="700" width="300" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="720.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Kiểm tra ràng buộc khóa ngoại: Kiểm tra</text>
  <text x="610.0" y="732.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">cá thể động vật trong bảng ANIMALS</text>
