  <text x="220.0" y="202.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">động vật</text>
  <rect x="460.0" y="170" width="300" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="190.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Tiếp nhận yêu cầu, truy vấn bảng SPECIES</text>
  <text x="610.0" y="202.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">và hiển thị danh sách các loài động vật</text>
  <polygon points="220.0,240 300.0,267.5 220.0,295 140.0,267.5" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="220.0" y="261.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#000000" text-anchor="middle">Chọn nghiệp vụ quản</text>
  <text x="220.0" y="272.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#000000" text-anchor="middle">lý?</text>
  <rect x="90.0" y="320" width="260" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="220.0" y="328.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Chọn &#x27;Thêm loài mới&#x27; -&gt; Nhập thông</text>
  <text x="220.0" y="340.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">tin: Tên tiếng Việt, Tên khoa học,</text>
  <text x="220.0" y="352.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">IUCN, Sinh cảnh, Khẩu phần, Ảnh -&gt;</text>
  <text x="220.0" y="364.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Bấm &#x27;Lưu&#x27;</text>
  <rect x="460.0" y="320" width="300" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="334.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Kiểm tra tính hợp lệ dữ liệu (Tên loài &amp;</text>
  <text x="610.0" y="346.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Tên khoa học bắt buộc, kiểm tra trùng</text>
  <text x="610.0" y="358.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">lặp)</text>
