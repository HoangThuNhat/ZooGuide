  <text x="610.0" y="791.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#000000" text-anchor="middle">Đang có động vật thuộc</text>
  <text x="610.0" y="802.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#000000" text-anchor="middle">loài này?</text>
  <rect x="460.0" y="840" width="300" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="860.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Từ chối xóa và hiển thị cảnh báo: Không</text>
  <text x="610.0" y="872.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">thể xóa loài đang chứa động vật</text>
  <rect x="460.0" y="910" width="300" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="924.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Xóa bản ghi khỏi bảng SPECIES, xóa dòng</text>
  <text x="610.0" y="936.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">khỏi danh sách và hiển thị thông báo</text>
  <text x="610.0" y="948.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">thành công</text>
