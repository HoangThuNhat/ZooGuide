  <text x="220.0" y="202.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">quét camera QR code</text>
  <rect x="460.0" y="170" width="300" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="190.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Tiếp nhận yêu cầu, truy vấn bảng TICKETS</text>
  <text x="610.0" y="202.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">theo mã vé chuẩn hóa</text>
  <polygon points="610.0,240 700.0,267.5 610.0,295 520.0,267.5" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="267.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#000000" text-anchor="middle">Tìm thấy vé trong DB?</text>
  <rect x="460.0" y="310" width="300" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="330.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Hiển thị thông báo: Vé không tồn tại</text>
  <text x="610.0" y="342.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">trên hệ thống (404 TICKET_NOT_FOUND)</text>
  <polygon points="610.0,380 700.0,407.5 610.0,435 520.0,407.5" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="407.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#000000" text-anchor="middle">Trạng thái vé là Valid?</text>
  <rect x="460.0" y="450" width="300" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="470.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Hiển thị thông báo: Vé đã qua sử dụng,</text>
  <text x="610.0" y="482.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">đã hủy hoặc bị khóa (400 Bad Request)</text>
  <polygon points="610.0,520 700.0,547.5 610.0,575 520.0,547.5" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="541.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#000000" text-anchor="middle">Thời gian hiện tại &lt;=</text>
  <text x="610.0" y="552.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#000000" text-anchor="middle">ValidUntil?</text>
  <rect x="460.0" y="590" width="300" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="610.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Cập nhật Status = Expired trong DB và</text>
  <text x="610.0" y="622.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">hiển thị thông báo vé đã quá hạn</text>
  <rect x="460.0" y="660" width="300" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="668.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Khởi tạo TICKET_SESSION mới (SessionId</text>
  <text x="610.0" y="680.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">GUID, StartedAt, ExpiredAt,</text>
  <text x="610.0" y="692.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Status=Active) -&gt; Lưu DB -&gt; Trả về token</text>
  <text x="610.0" y="704.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">phiên</text>
  <rect x="90.0" y="660" width="260" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="220.0" y="674.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Lưu SessionId vào localStorage,</text>
  <text x="220.0" y="686.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">nâng cấp vai trò thành &#x27;Validated</text>
  <text x="220.0" y="698.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Visitor&#x27; và mở khóa tham quan</text>
  <rect x="460.0" y="740" width="300" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="760.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Định kỳ tiếp nhận yêu cầu verify để kiểm</text>
  <text x="610.0" y="772.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">tra và duy trì phiên hoạt động</text>
  <polygon points="220.0,810 300.0,837.5 220.0,865 140.0,837.5" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="220.0" y="831.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#000000" text-anchor="middle">Hình thức kết thúc</text>
  <text x="220.0" y="842.5" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#000000" text-anchor="middle">phiên tham quan?</text>
  <rect x="460.0" y="880" width="300" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="894.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Cập nhật Status = Revoked/Terminated</text>
  <text x="610.0" y="906.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">trong TICKET_SESSIONS -&gt; Khóa lại các</text>
  <text x="610.0" y="918.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">quyền truy cập nâng cao</text>
