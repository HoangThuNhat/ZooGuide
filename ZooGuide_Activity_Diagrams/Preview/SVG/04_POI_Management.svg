  <text x="220.0" y="334.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Nhập Tên POI, Thể loại (gate,</text>
  <text x="220.0" y="346.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">landmark...), Mô tả, Tọa độ</text>
  <text x="220.0" y="358.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Lat/Lng, Phân khu -&gt; Bấm &#x27;Tạo POI&#x27;</text>
  <rect x="460.0" y="320" width="300" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="334.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Validate tọa độ WGS84, INSERT bản ghi</text>
  <text x="610.0" y="346.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">vào bảng POINTS_OF_INTEREST và vẽ Marker</text>
  <text x="610.0" y="358.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">trên bản đồ</text>
  <rect x="90.0" y="410" width="260" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="220.0" y="430.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Chọn POI đã khảo sát GPS thực địa</text>
  <text x="220.0" y="442.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">-&gt; Bấm &#x27;Xác nhận kiểm định tọa độ&#x27;</text>
  <rect x="460.0" y="410" width="300" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="424.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">UPDATE trường IsVerified = true, lưu</text>
  <text x="610.0" y="436.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">nguồn khảo sát vào Database và cập nhật</text>
  <text x="610.0" y="448.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">huy hiệu &#x27;Đã kiểm định&#x27; trên giao diện</text>
  <rect x="90.0" y="500" width="260" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="220.0" y="514.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Nhập kịch bản văn bản, chọn file</text>
  <text x="220.0" y="526.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">âm thanh .mp3 thuyết minh POI -&gt;</text>
  <text x="220.0" y="538.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Bấm &#x27;Tải lên&#x27;</text>
  <rect x="460.0" y="500" width="300" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="514.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Upload file âm thanh lên Supabase</text>
  <text x="610.0" y="526.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Storage và lưu metadata vào bảng</text>
  <text x="610.0" y="538.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">POI_NARRATIONS -&gt; Thông báo thành công</text>
