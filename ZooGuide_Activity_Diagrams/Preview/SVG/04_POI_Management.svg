  <text x="220.0" y="616.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">(Active/Inactive) hoặc bấm Xóa</text>
  <text x="220.0" y="628.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">điểm tham quan</text>
  <rect x="460.0" y="590" width="300" height="52" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="610.0" y="604.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">UPDATE trạng thái IsActive hoặc DELETE</text>
  <text x="610.0" y="616.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">bản ghi khỏi POINTS_OF_INTEREST -&gt; Làm</text>
  <text x="610.0" y="628.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">mới bảng danh sách</text>
